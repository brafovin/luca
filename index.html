<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FreshDrop – Soft Drinks bestellen</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <div class="header-inner">
      <div class="logo">
        <span class="logo-icon">🥤</span>
        <span class="logo-text">FreshDrop</span>
      </div>
      <nav class="nav-cats" id="navCats">
        <button class="nav-btn active" data-cat="all">Alle</button>
        <button class="nav-btn" data-cat="cola">Cola</button>
        <button class="nav-btn" data-cat="limo">Limo</button>
        <button class="nav-btn" data-cat="energy">Energy</button>
        <button class="nav-btn" data-cat="wasser">Wasser</button>
        <button class="nav-btn" data-cat="saft">Saft</button>
      </nav>
      <button class="cart-trigger" id="cartTrigger" aria-label="Warenkorb öffnen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
        <span class="badge" id="badge" hidden>0</span>
      </button>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="hero-content">
        <h1>Frisch. Kalt.<br>Direkt zu dir.</h1>
        <p>Deine Lieblingsgetränke – schnell bestellt, schnell geliefert.</p>
        <button class="hero-cta" id="heroCta">Jetzt bestellen</button>
      </div>
      <div class="hero-visual">
        <div class="bubble b1">🍋</div>
        <div class="bubble b2">🥤</div>
        <div class="bubble b3">⚡</div>
        <div class="bubble b4">💧</div>
        <div class="bubble b5">🍊</div>
      </div>
    </section>

    <section class="products" id="products"></section>
  </main>

  <!-- Cart Panel -->
  <div class="cart-backdrop" id="cartBackdrop"></div>
  <aside class="cart-panel" id="cartPanel" aria-hidden="true">
    <div class="cp-head">
      <h2>Warenkorb</h2>
      <button class="cp-close" id="cartClose" aria-label="Schließen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="cp-body" id="cpBody">
      <div class="cp-empty">
        <span>🛒</span>
        <p>Noch nichts im Warenkorb</p>
      </div>
    </div>
    <div class="cp-foot" id="cpFoot">
      <div class="cp-summary">
        <span>Gesamt</span>
        <strong id="cpTotal">0,00 €</strong>
      </div>
      <button class="checkout-btn" id="checkoutBtn" disabled>Zur Kasse →</button>
    </div>
  </aside>

  <!-- Order Modal -->
  <div class="overlay" id="orderOverlay">
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlgTitle">
      <button class="dlg-close" id="dlgClose" aria-label="Abbrechen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
      <h2 id="dlgTitle">Bestellung abschließen</h2>
      <div class="dlg-order-summary" id="dlgSummary"></div>
      <form id="orderForm" novalidate>
        <div class="field">
          <label for="fName">Name</label>
          <input id="fName" type="text" placeholder="Dein vollständiger Name" autocomplete="name" required />
        </div>
        <div class="field">
          <label for="fStreet">Straße &amp; Hausnummer</label>
          <input id="fStreet" type="text" placeholder="Musterstraße 12" autocomplete="address-line1" required />
        </div>
        <div class="field field-row">
          <div class="field">
            <label for="fZip">PLZ</label>
            <input id="fZip" type="text" placeholder="12345" maxlength="5" inputmode="numeric" required />
          </div>
          <div class="field">
            <label for="fCity">Stadt</label>
            <input id="fCity" type="text" placeholder="Berlin" autocomplete="address-level2" required />
          </div>
        </div>
        <div class="field">
          <label for="fPhone">Telefon</label>
          <input id="fPhone" type="tel" placeholder="+49 170 1234567" autocomplete="tel" required />
        </div>
        <div class="dlg-actions">
          <button type="button" class="btn-ghost" id="dlgCancel">Abbrechen</button>
          <button type="submit" class="btn-primary">Jetzt bestellen</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Success Screen -->
  <div class="overlay" id="successOverlay">
    <div class="dialog success-dialog" role="dialog" aria-modal="true">
      <div class="success-anim">🎉</div>
      <h2>Bestellung aufgegeben!</h2>
      <p id="successDetail"></p>
      <button class="btn-primary" id="successOk">Weiter shoppen</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
